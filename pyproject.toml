[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-runtime"
version = "0.0.1"
requires-python = ">=3.11"

[project.scripts]
myravant-play = "astra_runtime.myravant_terminal:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
