name: CI

on:
  pull_request:
    # Environmental depth is reviewed separately, stacked on locality PR #539.
    branches: [main, play-tarrow-reach-1]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: core-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Preserve exact candidate identity in replay/evidence receipts.
          # PR default checkout otherwise uses a synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Check installed dependencies
        run: python -m pip check
      - name: Timed work, environmental processes and replay contracts
        run: python -m pytest -q tests/test_play_tarrow_time.py tests/test_play_tarrow_time_edges.py
      - name: Water quantities, cleaning and replay contracts
        run: python -m pytest -q tests/test_play_water_cleaning.py
      - name: Material placement, fastening and replay contracts
        run: python -m pytest -q tests/test_play_material.py
      - name: Tarrow environmental-depth contracts
        run: python -m pytest -q tests/test_play_tarrow_environment.py
      - name: Tarrow locality and initial-placement contracts
        run: python -m pytest -q tests/test_play_tarrow_locality.py
      - name: Specialist composition family contracts
        run: python -m pytest -q tests/test_play_specialist_composition.py
      - name: Approved posture family and replay contracts
        run: python -m pytest -q tests/test_play_posture_movement.py
      - name: Focused traversal contract and installed-client tests
        run: python -m pytest -q tests/test_play_breadth_traversal_crawl.py
      - name: Focused two-step contract and installed-client tests
        run: python -m pytest -q tests/test_play_composable_two_step.py
      - name: Focused physical-affordance contracts and installed-client tests
        run: python -m pytest -q tests/test_play_physical_affordance_1.py
      - name: Enclosed-light, help and supplemental gameplay regression tests
        run: python -m pytest -q tests/test_play_enclosed_light_transport.py tests/test_play_help_topics.py tests/test_play_physical_affordance_adversarial.py
      - name: Focused contact-affordance cross-system and installed-client tests
        run: python -m pytest -q tests/test_play_contact_affordance_composition_1.py tests/test_play_breadth1_player_senses.py tests/test_play_breadth3_physical_placement.py tests/test_play_composable_two_step.py
      - name: Physical-access batch generality, intent and installed campaign tests
        run: python -m pytest -q tests/test_play_physical_access_batch_1.py tests/test_play_waystone_drag_recovery.py
      - name: Run tests
        run: python -m pytest -q
      - name: Generate timed work campaigns and isolated mutations
        run: |
          python scripts/report_myravant_time.py --output time-evidence.json
          python scripts/report_myravant_time_mutations.py --output time-mutations.json
      - name: Upload timed work evidence
        uses: actions/upload-artifact@v4
        with:
          name: myravant-tarrow-time-linux
          path: |
            time-evidence.json
            time-mutations.json
          if-no-files-found: error
      - name: Generate water campaigns and isolated mutations
        run: |
          python scripts/report_myravant_water.py --output water-evidence.json
          python scripts/report_myravant_water_mutations.py --output water-mutations.json
      - name: Upload water and cleaning evidence
        uses: actions/upload-artifact@v4
        with:
          name: myravant-tarrow-water-linux
          path: |
            water-evidence.json
            water-mutations.json
          if-no-files-found: error
      - name: Generate material campaigns and isolated mutations
        run: |
          python scripts/report_myravant_material.py --output material-evidence.json
          python scripts/report_myravant_material_mutations.py --output material-mutations.json
      - name: Upload material interaction evidence
        uses: actions/upload-artifact@v4
        with:
          name: myravant-tarrow-material-linux
          path: |
            material-evidence.json
            material-mutations.json
          if-no-files-found: error
      - name: Generate environmental-depth journeys and mutations
        run: |
          python scripts/report_myravant_environment.py --output environment-evidence.json
          python scripts/report_myravant_environment_mutations.py --output environment-mutations.json
      - name: Upload environmental-depth evidence
        uses: actions/upload-artifact@v4
        with:
          name: myravant-tarrow-environment-linux
          path: |
            environment-evidence.json
            environment-mutations.json
          if-no-files-found: error
      - name: Generate Tarrow locality journeys and mutations
        run: |
          python scripts/report_myravant_tarrow.py --output tarrow-evidence.json
          python scripts/report_myravant_tarrow_mutations.py --output tarrow-mutations.json
      - name: Upload Tarrow locality evidence
        uses: actions/upload-artifact@v4
        with:
          name: myravant-tarrow-locality-linux
          path: |
            tarrow-evidence.json
            tarrow-mutations.json
          if-no-files-found: error
      - name: Generate specialist composition campaign evidence
        run: python scripts/report_myravant_specialist_composition.py --output specialist-composition-evidence.json
      - name: Generate isolated specialist composition mutations
        run: python scripts/report_myravant_specialist_mutations.py --output specialist-composition-mutations.json
      - name: Upload specialist composition evidence
        uses: actions/upload-artifact@v4
        with:
          name: myravant-specialist-composition-linux
          path: |
            specialist-composition-evidence.json
            specialist-composition-mutations.json
          if-no-files-found: error
      - name: Generate posture campaign evidence
        run: python scripts/report_myravant_posture.py --output posture-evidence.json
      - name: Generate isolated posture mutation evidence
        run: python scripts/report_myravant_posture_mutations.py --output posture-mutations.json
      - name: Upload posture evidence
        uses: actions/upload-artifact@v4
        with:
          name: myravant-posture-family-linux
          path: |
            posture-evidence.json
            posture-mutations.json
          if-no-files-found: error
      - name: Generate sustained physical-access campaign evidence
        run: python scripts/report_myravant_physical_access.py --output physical-access-evidence.json
      - name: Upload physical-access campaign evidence
        uses: actions/upload-artifact@v4
        with:
          name: myravant-physical-access-campaign-linux
          path: physical-access-evidence.json
          if-no-files-found: error
      - name: Generate synthetic-play discovery evidence
        run: python scripts/report_myravant_synthetic_play.py --output synthetic-play-evidence.json
      - name: Upload synthetic-play discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: myravant-synthetic-play-discovery-linux
          path: synthetic-play-evidence.json
          if-no-files-found: error
      - name: Generate ordinary-action coverage evidence
        run: python scripts/report_myravant_action_coverage.py --output action-coverage-evidence.json
      - name: Upload ordinary-action coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: myravant-action-coverage-baseline-linux
          path: action-coverage-evidence.json
          if-no-files-found: error

  core-windows:
    name: core-windows
    runs-on: windows-latest
    # Budget for the long Windows suite plus focused/full installed-family coverage.
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Configure Git for Windows checkout
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Preserve exact candidate identity in replay/evidence receipts.
          # PR default checkout otherwise uses a synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Check installed dependencies
        run: python -m pip check
      - name: Timed work, environmental processes and replay contracts
        run: python -m pytest -q tests/test_play_tarrow_time.py tests/test_play_tarrow_time_edges.py
      - name: Water quantities, cleaning and replay contracts
        run: python -m pytest -q tests/test_play_water_cleaning.py
      - name: Material placement, fastening and replay contracts
        run: python -m pytest -q tests/test_play_material.py
      - name: Tarrow environmental-depth contracts
        run: python -m pytest -q tests/test_play_tarrow_environment.py
      - name: Tarrow locality and initial-placement contracts
        run: python -m pytest -q tests/test_play_tarrow_locality.py
      - name: Specialist composition family contracts
        run: python -m pytest -q tests/test_play_specialist_composition.py
      - name: Approved posture family and replay contracts
        run: python -m pytest -q tests/test_play_posture_movement.py
      - name: Focused traversal contract and installed-client tests
        run: python -m pytest -q tests/test_play_breadth_traversal_crawl.py
      - name: Focused two-step contract and installed-client tests
        run: python -m pytest -q tests/test_play_composable_two_step.py
      - name: Focused physical-affordance contracts and installed-client tests
        run: python -m pytest -q tests/test_play_physical_affordance_1.py
      - name: Enclosed-light, help and supplemental gameplay regression tests
        run: python -m pytest -q tests/test_play_enclosed_light_transport.py tests/test_play_help_topics.py tests/test_play_physical_affordance_adversarial.py
      - name: Focused contact-affordance cross-system and installed-client tests
        run: python -m pytest -q tests/test_play_contact_affordance_composition_1.py tests/test_play_breadth1_player_senses.py tests/test_play_breadth3_physical_placement.py tests/test_play_composable_two_step.py
      - name: Physical-access batch generality, intent and installed campaign tests
        run: python -m pytest -q tests/test_play_physical_access_batch_1.py tests/test_play_waystone_drag_recovery.py
      - name: Run tests
        run: python -m pytest -q
