name: CI

on:
  pull_request:
    # Environmental depth is reviewed separately, stacked on locality PR #539.
    branches: [main, play-tarrow-reach-1, play-tarrow-investigation-1]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: core-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Preserve exact candidate identity in replay/evidence receipts.
          # PR default checkout otherwise uses a synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install -e .
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run tests
        env:
          MYRAVANT_ACTOR_CAMPAIGN_REPORT_DIR: actor-campaigns
          MYRAVANT_ACTOR_ASSESSOR_REPORT: actor-assessor.json
        run: python -m pytest -q -n 2 --dist loadfile --max-worker-restart=0 --durations=50 --durations-min=0.5 --junitxml=suite.xml
      - name: Generate isolated actor mutations
        # Installed campaigns and separate assessment are exported by the full suite.
        run: python scripts/report_myravant_actor_mutations.py --output actor-mutations.json
      - name: Upload actor participation evidence
        uses: actions/upload-artifact@v4
        with:
          name: myravant-tarrow-actors-linux
          path: |
            actor-campaigns/*.json
            actor-assessor.json
            actor-mutations.json
          if-no-files-found: error

      - name: Upload suite profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-core-linux
          path: suite.xml
          if-no-files-found: error

  retained-evidence-linux:
    name: retained-evidence-linux
    runs-on: ubuntu-latest
    # Independent retained reports keep the full-suite job within its existing cap.
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Preserve exact candidate identity in replay/evidence receipts.
          # PR default checkout otherwise uses a synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Check installed dependencies
        run: python -m pip check
      - name: Generate retained timed work campaigns and isolated mutations
        run: |
          python scripts/report_myravant_time.py --output time-evidence.json
          python scripts/report_myravant_time_mutations.py --output time-mutations.json
      - name: Upload timed work evidence
        uses: actions/upload-artifact@v4
        with:
          name: myravant-tarrow-time-linux
          path: |
            time-evidence.json
            time-mutations.json
          if-no-files-found: error
      - name: Generate water campaigns and isolated mutations
        run: |
          python scripts/report_myravant_water.py --output water-evidence.json
          python scripts/report_myravant_water_mutations.py --output water-mutations.json
      - name: Upload water and cleaning evidence
        uses: actions/upload-artifact@v4
        with:
          name: myravant-tarrow-water-linux
          path: |
            water-evidence.json
            water-mutations.json
          if-no-files-found: error
      - name: Generate surface-water installed journeys and mutations
        run: |
          python scripts/report_myravant_surface_water.py --output surface-water-evidence.json
          python scripts/report_myravant_surface_water_mutations.py --output surface-water-mutations.json
      - name: Upload surface-water evidence
        uses: actions/upload-artifact@v4
        with:
          name: myravant-tarrow-surface-water-linux
          path: |
            surface-water-evidence.json
            surface-water-mutations.json
          if-no-files-found: error
      - name: Generate material campaigns and isolated mutations
        run: |
          python scripts/report_myravant_material.py --output material-evidence.json
          python scripts/report_myravant_material_mutations.py --output material-mutations.json
      - name: Upload material interaction evidence
        uses: actions/upload-artifact@v4
        with:
          name: myravant-tarrow-material-linux
          path: |
            material-evidence.json
            material-mutations.json
          if-no-files-found: error
      - name: Generate environmental-depth journeys and mutations
        run: |
          python scripts/report_myravant_environment.py --output environment-evidence.json
          python scripts/report_myravant_environment_mutations.py --output environment-mutations.json
      - name: Upload environmental-depth evidence
        uses: actions/upload-artifact@v4
        with:
          name: myravant-tarrow-environment-linux
          path: |
            environment-evidence.json
            environment-mutations.json
          if-no-files-found: error
      - name: Generate Tarrow locality journeys and mutations
        run: |
          python scripts/report_myravant_tarrow.py --output tarrow-evidence.json
          python scripts/report_myravant_tarrow_mutations.py --output tarrow-mutations.json
      - name: Upload Tarrow locality evidence
        uses: actions/upload-artifact@v4
        with:
          name: myravant-tarrow-locality-linux
          path: |
            tarrow-evidence.json
            tarrow-mutations.json
          if-no-files-found: error
      - name: Generate specialist composition campaign evidence
        run: python scripts/report_myravant_specialist_composition.py --output specialist-composition-evidence.json
      - name: Generate isolated specialist composition mutations
        run: python scripts/report_myravant_specialist_mutations.py --output specialist-composition-mutations.json
      - name: Upload specialist composition evidence
        uses: actions/upload-artifact@v4
        with:
          name: myravant-specialist-composition-linux
          path: |
            specialist-composition-evidence.json
            specialist-composition-mutations.json
          if-no-files-found: error
      - name: Generate posture campaign evidence
        run: python scripts/report_myravant_posture.py --output posture-evidence.json
      - name: Generate isolated posture mutation evidence
        run: python scripts/report_myravant_posture_mutations.py --output posture-mutations.json
      - name: Upload posture evidence
        uses: actions/upload-artifact@v4
        with:
          name: myravant-posture-family-linux
          path: |
            posture-evidence.json
            posture-mutations.json
          if-no-files-found: error
      - name: Generate sustained physical-access campaign evidence
        run: python scripts/report_myravant_physical_access.py --output physical-access-evidence.json
      - name: Upload physical-access campaign evidence
        uses: actions/upload-artifact@v4
        with:
          name: myravant-physical-access-campaign-linux
          path: physical-access-evidence.json
          if-no-files-found: error
      - name: Generate synthetic-play discovery evidence
        run: python scripts/report_myravant_synthetic_play.py --output synthetic-play-evidence.json
      - name: Upload synthetic-play discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: myravant-synthetic-play-discovery-linux
          path: synthetic-play-evidence.json
          if-no-files-found: error
      - name: Generate ordinary-action coverage evidence
        run: python scripts/report_myravant_action_coverage.py --output action-coverage-evidence.json
      - name: Upload ordinary-action coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: myravant-action-coverage-baseline-linux
          path: action-coverage-evidence.json
          if-no-files-found: error

  core-windows:
    name: core-windows
    runs-on: windows-latest
    # Budget for the long Windows suite plus focused/full installed-family coverage.
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Configure Git for Windows checkout
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Preserve exact candidate identity in replay/evidence receipts.
          # PR default checkout otherwise uses a synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run tests
        env:
          MYRAVANT_ACTOR_CAMPAIGN_REPORT_DIR: actor-campaigns
          MYRAVANT_ACTOR_ASSESSOR_REPORT: actor-assessor.json
        run: python -m pytest -q --durations=50 --durations-min=0.5 --junitxml=suite.xml
      - name: Upload actor assessment and installed campaigns
        uses: actions/upload-artifact@v4
        with:
          name: myravant-tarrow-actors-windows
          path: |
            actor-campaigns/*.json
            actor-assessor.json
          if-no-files-found: error

      - name: Upload suite profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-core-windows
          path: suite.xml
          if-no-files-found: error

  focused-contracts:
    name: focused-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            budget: 20
          - platform: windows
            runner: windows-latest
            budget: 25
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.budget }}
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Configure Git for Windows checkout
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Check installed dependencies
        run: python -m pip check
      - name: Actor participation, shared intervals and private evidence
        run: python -m pytest -q tests/test_play_actor_context_compatibility.py tests/test_play_actor_state.py tests/test_play_actor_knowledge.py tests/test_play_actor_physical.py tests/test_play_actor_scheduling.py tests/test_play_actor_persistence.py tests/test_play_actor_transfer.py tests/test_play_actors_entry.py tests/test_play_actor_mutations.py tests/test_play_actor_review_edges.py tests/test_play_investigation_readonly.py tests/test_play_investigation_neutral.py tests/test_play_investigation_cases.py tests/test_play_investigation_journey_contracts.py tests/test_play_investigation_mutations.py tests/test_play_investigation_assessor.py
      - name: Timed work, environmental processes and replay contracts
        run: python -m pytest -q tests/test_play_tarrow_time.py tests/test_play_tarrow_time_edges.py
      - name: Water quantities, cleaning and replay contracts
        run: python -m pytest -q tests/test_play_water_cleaning.py
      - name: Surface liquid, deliberate contact and actor replay contracts
        run: python -m pytest -q tests/test_play_tarrow_surface_water.py tests/test_play_tarrow_surface_water_edges.py tests/test_play_tarrow_surface_contention.py
      - name: Material placement, fastening and replay contracts
        run: python -m pytest -q tests/test_play_material.py
      - name: Tarrow environmental-depth contracts
        run: python -m pytest -q tests/test_play_tarrow_environment.py
      - name: Tarrow locality and initial-placement contracts
        run: python -m pytest -q tests/test_play_tarrow_locality.py
      - name: Specialist composition family contracts
        run: python -m pytest -q tests/test_play_specialist_composition.py
      - name: Approved posture family and replay contracts
        run: python -m pytest -q tests/test_play_posture_movement.py
      - name: Focused traversal contract and installed-client tests
        run: python -m pytest -q tests/test_play_breadth_traversal_crawl.py
      - name: Focused two-step contract and installed-client tests
        run: python -m pytest -q tests/test_play_composable_two_step.py
      - name: Focused physical-affordance contracts and installed-client tests
        run: python -m pytest -q tests/test_play_physical_affordance_1.py
      - name: Enclosed-light, help and supplemental gameplay regression tests
        run: python -m pytest -q tests/test_play_enclosed_light_transport.py tests/test_play_help_topics.py tests/test_play_physical_affordance_adversarial.py
      - name: Focused contact-affordance cross-system and installed-client tests
        run: python -m pytest -q tests/test_play_contact_affordance_composition_1.py tests/test_play_breadth1_player_senses.py tests/test_play_breadth3_physical_placement.py tests/test_play_composable_two_step.py
      - name: Bounded transformation, restored function, actor methods and replay
        run: python -m pytest -q tests/test_play_transformation_1.py
      - name: Physical-access batch generality, intent and installed campaign tests
        run: python -m pytest -q tests/test_play_physical_access_batch_1.py tests/test_play_waystone_drag_recovery.py

  investigation-evidence-linux:
    name: investigation-evidence-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run installed investigation campaigns twice per circumstance
        run: python scripts/report_myravant_investigation.py --output investigation-journeys.json
      - name: Check separate objective-based assessment
        run: python scripts/assess_myravant_investigation.py --input investigation-journeys.json --output investigation-assessment.json
      - name: Execute six isolated investigation mutations
        run: python scripts/report_myravant_investigation_mutations.py --output investigation-mutations.json
      - name: Upload investigation evidence
        uses: actions/upload-artifact@v4
        with:
          name: myravant-investigation-linux
          path: |
            investigation-journeys.json
            investigation-assessment.json
            investigation-mutations.json
          if-no-files-found: error

  transformation-evidence-linux:
    name: transformation-evidence-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run three public transformation campaigns twice
        run: python scripts/report_myravant_transformation.py --output transformation-journeys.json
      - name: Assess separately declared developer goals
        run: python scripts/assess_myravant_transformation.py --input transformation-journeys.json --output transformation-assessment.json
      - name: Detect eleven isolated transformation mutations
        run: python scripts/report_myravant_transformation_mutations.py --output transformation-mutations.json
      - name: Upload transformation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myravant-transformation-linux
          path: |
            transformation-journeys.json
            transformation-assessment.json
            transformation-mutations.json
          if-no-files-found: warn
