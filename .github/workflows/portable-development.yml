name: Portable development
on:
  pull_request:
    branches: [main]
    paths:
      - AGENTS.md
      - README.md
      - docs/development/**
      - scripts/myravant_dev.py
      - scripts/myravant_assist.py
      - tests/test_myravant_portable_development.py
      - tests/test_myravant_assist.py
      - .github/workflows/portable-development.yml
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - README.md
      - docs/development/**
      - scripts/myravant_dev.py
      - scripts/myravant_assist.py
      - tests/test_myravant_portable_development.py
      - tests/test_myravant_assist.py
      - .github/workflows/portable-development.yml
permissions:
  contents: read
concurrency:
  group: portable-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    name: portable-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Configure Windows checkout
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install developer dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
          python -m pip check
      - name: Verify portable tooling and guidance
        run: python scripts/myravant_dev.py verify --profile focused --test-path tests/test_myravant_portable_development.py --test-path tests/test_myravant_assist.py --output "${{ runner.temp }}/portable-evidence"
      - name: Exercise ordinary-chat source packet and freshness CLI
        run: |
          python scripts/myravant_assist.py packet --task "portable chat feedback" --base HEAD --output "${{ runner.temp }}/portable-evidence/task-packet.json"
          python scripts/myravant_assist.py refresh --packet "${{ runner.temp }}/portable-evidence/task-packet.json" --output "${{ runner.temp }}/portable-evidence/freshness.json"
      - name: Upload developer verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.os }}
          path: ${{ runner.temp }}/portable-evidence
          if-no-files-found: error
