    {
      "requirement_id": "R4D-IV-001",
      "name": "continue_play_after_restore",
      "requirement": "after checkpointing a committed P1-to-P2 movement, destroying the original in-memory runtime state, and restoring exclusively from the accepted checkpoint, a completely new lawful P2-to-P3 movement command must commit normally; a second checkpoint and restore must then recover the actor at P3"
    },
    {
      "requirement_id": "R4D-IV-002",
      "name": "true_process_boundary_round_trip",
      "requirement": "the implementation test must exercise an actual local file boundary and reconstruct without relying on surviving authoritative Python objects or hidden runtime context"
    },
    {
      "requirement_id": "R4D-IV-003",
      "name": "complete_r4_c_authoritative_evidence_preservation",
      "requirement": "restore must preserve the bounded R4-B representation and all R4-C committed-transition evidence required by the existing retry and replay semantics, including command identity, fingerprint, preview, state delta, receipt, pre/post digests, relation identities, and attributable spatial/opportunity evidence"
    },
    {
      "requirement_id": "R4D-IV-004",
      "name": "strict_checkpoint_envelope_validation",
      "requirement": "restore must validate bounded format identity, format version, campaign identity, authoritative payload, integrity evidence, and checkpoint qualification/provenance without guessing or silent reinterpretation"
    },
    {
      "requirement_id": "R4D-IV-005",
      "name": "atomic_checkpoint_replacement",
      "requirement": "an injected failure during replacement of an existing valid checkpoint must leave the prior accepted checkpoint wholly restorable and must never expose a mixture of old and new authoritative state"
    },
    {
      "requirement_id": "R4D-IV-006",
      "name": "corruption_fail_closed_matrix",
      "requirement": "the implementation must exercise distinct structural, integrity, identity, and semantic corruption cases and reject every invalid checkpoint rather than materializing plausible authoritative state"
    },
    {
      "requirement_id": "R4D-IV-007",
      "name": "post_restore_retry_identity",
      "requirement": "after restore an identical previously committed command must remain an idempotent technical retry and the same command ID with materially different command content must remain a retry conflict"
    },
    {
      "requirement_id": "R4D-IV-008",
      "name": "multiple_committed_transition_preservation",
      "requirement": "a checkpoint containing at least two committed movement transitions must restore both attributable transition records and the final authoritative position"
    },
    {
      "requirement_id": "R4D-IV-009",
      "name": "restore_then_checkpoint_determinism",
      "requirement": "checkpoint then restore then checkpoint without intervening semantic change must preserve the same canonical authoritative payload, excluding metadata that is lawfully outside the authoritative payload comparison"
    },
    {
      "requirement_id": "R4D-IV-010",
      "name": "storage_order_is_not_causal_order",
      "requirement": "checkpoint tuple position, serialized order, command-ID ordering, file order, and restore order must not be treated as AFQR-04 logical or causal time"
    },
    {
      "requirement_id": "R4D-IV-011",
      "name": "bounded_replay_claim",
      "requirement": "R4-D may preserve the evidence consumed by existing R4-C retry/replay behavior but must not claim that one checkpoint is a complete campaign event history or genesis replay log"
    },
    {
      "requirement_id": "R4D-IV-012",
      "name": "operational_local_durability_boundary",
      "requirement": "checkpoint success must mean the implementation has completed the local durability operation it claims and may not report an accepted checkpoint while essential bytes exist only in application buffering"
    },
    {
      "requirement_id": "R4D-IV-013",
      "name": "offline_no_model_dependency",
      "requirement": "checkpoint and restore must operate locally and offline without model invocation, narration, network access, or reconstruction of authoritative state from prose"
    }
