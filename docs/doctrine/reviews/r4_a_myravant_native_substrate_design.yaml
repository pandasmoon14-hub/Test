    "name": "persistent_world_entity_and_location_relation_representation",
    "purpose": "Provide the minimum deterministic representation needed for people or creatures, places, and objects to retain campaign-local identity across turns and sessions and to express a lawful current-location relationship without creating a universal world-state owner.",
